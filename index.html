<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable: blocking pinch-zoom fails WCAG 1.4.4,
         and in the installed PWA iOS honours it absolutely, so a low-vision
         user has no way to enlarge anything. The reason it was there — iOS
         zooming the page when you focus a small input — is handled properly
         instead, by giving every input a 16px font size. viewport-fit=cover
         stays: it's what makes env(safe-area-inset-*) work. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F2" />
    <title>Padelier</title>
    <!-- Installable app (PWA): home-screen icon + fullscreen standalone launch. No service worker (kept off to avoid stale-cache bugs). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Padelier" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Padelier brand type: Fraunces (headlines), Inter (interface), Space Grotesk (scores), Lora (wordmark) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded NON-BLOCKING, and that is the whole point.
         A plain <link rel="stylesheet"> is render-blocking: the browser paints
         nothing until it resolves. On a court with no signal that request has
         to time out first, so the app sat on a blank screen for seconds before
         showing anything — the fonts were never the problem, waiting for them
         was. `media="print"` makes it non-blocking, and the onload flips it to
         all once it arrives; text renders immediately in the fallback stack
         either way (display=swap).
         The real fix is self-hosting these four families, which also removes a
         third party from the critical path — that is in docs/BACKLOG.md. This
         is the one-line version of it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
